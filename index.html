            display: block;

        /* === NEW METHOD USING A DIV INSTEAD OF INPUT === */
        .info-input {
            position: absolute;
            background-color: transparent;
            border: none;
            outline: none;
            box-sizing: border-box;
            font-family: 'Siemreap', 'Segoe UI', sans-serif;
            font-size: 16pt;
            font-weight: 700;
            
            /* Using flexbox for reliable centering inside the div */
            display: flex;
            align-items: center;
            padding: 0 5px;
            
            /* Allows the div to be typed in */
            -webkit-user-modify: read-write;
            overflow-wrap: break-word;
            line-break: after-white-space;
        }
        
        /* Creates a fake placeholder for the contenteditable div */
        .info-input:empty::before {
            content: attr(data-placeholder);
            font-family: 'Segoe UI', sans-serif;
            color: #888;
            font-weight: 400;
            cursor: text;
        }

        #name-input {
            top: 196px; 
            left: 67px;

        }

        #phone-input {
            top: 373px; 
            left: 67px;
            width: 221px;
            height: 55px; 
        }
        
        #date-input {
            position: absolute;
            top: 70px;
            left: 170px;
            width: 111px;
            height: 31px;
            border: none;
            background-color: #ffffff;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14pt; 
            font-weight: 700;
            padding: 0 5px;
        }
        
        #save-button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: normal;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
        }

        #save-button:hover {
            background-color: #0056b3;
        }

<body>
    
    <div id="invoice-container">
        <img src="Demo.png" alt="Invoice Background" class="background-image">
        
        <div id="name-input" class="info-input" contenteditable="true" data-placeholder="Enter name..."></div>
        <div id="location-input" class="info-input" contenteditable="true" data-placeholder="Enter location..."></div>
        <div id="phone-input" class="info-input" contenteditable="true" data-placeholder="Enter phone..."></div>
        
        <input type="date" id="date-input">
    </div>

    <button id="save-button">Save Image</button>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            // Get all the elements we need
            const saveButton = document.getElementById('save-button');
            const invoiceContainer = document.getElementById('invoice-container');
            const dateInput = document.getElementById('date-input');
            const nameInput = document.getElementById('name-input');
            const locationInput = document.getElementById('location-input');
            const phoneInput = document.getElementById('phone-input');

            // --- LOAD DATA FROM LOCALSTORAGE ---
            // Function to load saved data when the page loads
            function loadData() {
                // Load text for name, location, and phone
                nameInput.textContent = localStorage.getItem('invoiceName') || '';
                locationInput.textContent = localStorage.getItem('invoiceLocation') || '';
                phoneInput.textContent = localStorage.getItem('invoicePhone') || '';

                // Load the date, or set to today if no date is saved
                const savedDate = localStorage.getItem('invoiceDate');
                if (savedDate) {
                    dateInput.value = savedDate;
                } else {
                    // Set to today's date if nothing is saved
                    const today = new Date();
                    const year = today.getFullYear();
                    const month = String(today.getMonth() + 1).padStart(2, '0'); // Months are 0-based
                    const day = String(today.getDate()).padStart(2, '0');
                    dateInput.value = `${year}-${month}-${day}`;
                }
            }

            // --- SAVE DATA TO LOCALSTORAGE ---
            // Add event listeners to save data whenever it changes
            nameInput.addEventListener('input', () => {
                localStorage.setItem('invoiceName', nameInput.textContent);
            });
            locationInput.addEventListener('input', () => {
                localStorage.setItem('invoiceLocation', locationInput.textContent);
            });
            phoneInput.addEventListener('input', () => {
                localStorage.setItem('invoicePhone', phoneInput.textContent);
            });
            dateInput.addEventListener('input', () => {
                localStorage.setItem('invoiceDate', dateInput.value);
            });

            // Call loadData when the page is ready
            loadData();

            // --- HTML2CANVAS LOGIC (unchanged) ---
            saveButton.addEventListener('click', () => {
                html2canvas(invoiceContainer, {
                    scale: 2, 
                    useCORS: true,
                    
                    onclone: (clonedDoc) => {
                        const style = clonedDoc.createElement('style');
                        style.innerHTML = `
                            #date-input::-webkit-calendar-picker-indicator {
                                display: none !important;
                            }
                        `;
                        clonedDoc.head.appendChild(style);
                    }
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL('image/png');
                    link.download = 'Pisey-Invoice.png';
                    link.click();
                }).catch(err => {
                    console.error('Oops, something went wrong!', err);
                });
            });
        });
    </script>
